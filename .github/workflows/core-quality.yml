name: Core quality

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  redline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run recorded gate parity and provider tests
        run: pnpm eval:redlines
      - name: Run BeautyPreferenceMemoryEval
        run: pnpm eval:preference-memory
      - name: Write recorded EvalRun artifact
        run: >-
          pnpm --filter @meiye/core eval:redlines:artifact
          "$GITHUB_WORKSPACE/output/evals/redlines.eval-run.json"
      - name: Write preference-memory EvalRun artifact
        run: >-
          pnpm --filter @meiye/core eval:preference-memory:artifact
          "$GITHUB_WORKSPACE/output/evals/preference-memory.eval-run.json"
      - name: Run pinned promptfoo recorded fixtures
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: >-
          pnpm dlx promptfoo@0.121.19 eval
          -c promptfooconfig.redlines.yaml
          --no-cache
          -o output/evals/promptfoo-redlines.json
      - name: Prove promptfoo assertions reject false output without provider errors
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: |
          if pnpm dlx promptfoo@0.121.19 eval \
            -c promptfooconfig.redlines.assertion-control.yaml \
            --no-cache; then
            echo "Promptfoo assertion control unexpectedly passed." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-redline-evals
          path: output/evals
          if-no-files-found: error

  live-redteam:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run opt-in Volcengine red-team
        continue-on-error: true
        env:
          PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: true
          VOLCENGINE_API_BASE_URL: ${{ secrets.VOLCENGINE_API_BASE_URL }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          VOLCENGINE_MODEL: ${{ secrets.VOLCENGINE_MODEL }}
        run: >-
          pnpm dlx promptfoo@0.121.19 redteam run
          -c promptfooconfig.redteam.yaml
          -o output/evals/live-redteam.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-redteam-results
          path: output/evals
          if-no-files-found: warn

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/contracts typecheck
      - run: pnpm --filter @meiye/core typecheck
      # pnpm appends extra script arguments after the test glob; NODE_OPTIONS
      # makes Node's test runner consume --test-reporter=spec directly.
      - run: pnpm --filter @meiye/core test
        env:
          NODE_OPTIONS: --test-reporter=spec

  root-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Initialize root quality evidence
        run: mkdir -p output/ci/root-required-quality && touch output/ci/root-required-quality/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Verify the quality-gate command contract
        run: node --test scripts/ci/*.test.mjs
      - name: Run root required quality gates
        run: bash scripts/ci/run-root-required-quality.sh
        env:
          CI_EVIDENCE_DIR: output/ci/root-required-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-required-quality-evidence
          path: output/ci/root-required-quality
          if-no-files-found: error

  core-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_test
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_dbos_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize persistence evidence
        run: mkdir -p output/ci/core-persistence && touch output/ci/core-persistence/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Provision business and DBOS test databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/core-persistence/provision.log
      # The full suite runs through Node's test runner so the persisted-test
      # assertion can read an authoritative summary instead of a tsx wrapper
      # that omits it. The script fails if either database URL is absent.
      - name: Run Core with persistence gates enabled
        run: bash scripts/ci/run-core-persistence.sh
        env:
          CORE_PERSISTENCE_LOG_PATH: output/ci/core-persistence/core-persistence-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-persistence-evidence
          path: output/ci/core-persistence
          if-no-files-found: error

  production-main-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      MODEL_EXECUTION_MODE: fixture
      PLAYWRIGHT_AUTH_BASE_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3010
      PLAYWRIGHT_CANDIDATE_PORT: 3010
      PLAYWRIGHT_CANVAS_PORT: 4210
      PLAYWRIGHT_CORE_PORT: 4110
      PLAYWRIGHT_PRODUCTION_CANDIDATE: true
      PORT: 3011
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_journey
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_journey_dbos
    steps:
      - uses: actions/checkout@v4
      - name: Initialize production journey evidence
        run: mkdir -p output/ci/production-main-journey && touch output/ci/production-main-journey/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision production-journey databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/production-main-journey/provision.log
      - name: Run production-build main journey
        run: bash scripts/ci/run-pr-production-journey.sh
        env:
          CI_EVIDENCE_DIR: output/ci/production-main-journey
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-main-journey-evidence
          path: |
            output/ci/production-main-journey
            mkfast-template-main/test-results
          if-no-files-found: error

  required:
    if: ${{ always() }}
    needs:
      - redline-evals
      - core
      - root-quality
      - core-persistence
      - production-main-journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every ordinary quality job to succeed
        run: node scripts/ci/assert-required-jobs.mjs
        env:
          REQUIRED_CORE_PERSISTENCE_RESULT: ${{ needs.core-persistence.result }}
          REQUIRED_CORE_RESULT: ${{ needs.core.result }}
          REQUIRED_PRODUCTION_MAIN_JOURNEY_RESULT: ${{ needs.production-main-journey.result }}
          REQUIRED_REDLINE_EVALS_RESULT: ${{ needs.redline-evals.result }}
          REQUIRED_ROOT_QUALITY_RESULT: ${{ needs.root-quality.result }}

  # Release-candidate acceptance builds every workspace, then boots Main, Core,
  # Worker, and Canvas for the real browser harness. Keep the historical run-e2e
  # label as an alias while release-candidate becomes the explicit RC signal.
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e_dbos
      HARNESS_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e_dbos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/security
          audit_status=0
          pnpm audit --prod --json | tee output/security/pnpm-audit.json || audit_status=$?
          echo "pnpm audit raw exit code: $audit_status"
          node scripts/ci/assert-production-audit.mjs output/security/pnpm-audit.json
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision E2E business and DBOS databases
        run: ./scripts/ci/provision-test-db.sh
      - name: Build and run release-candidate acceptance
        run: bash scripts/ci/run-release-candidate-quality.sh
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: output/security/pnpm-audit.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: mkfast-template-main/test-results
          if-no-files-found: ignore
