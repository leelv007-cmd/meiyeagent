name: Core quality

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

# D-038⑤: every quality job uses one immutable application-version identity for
# this workflow run. Production Core deployment is tracked separately below in
# the Harness release SOP; this variable does not claim that deployment exists.
env:
  HARNESS_DBOS_APPLICATION_VERSION: quality-${{ github.sha }}

jobs:
  redline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run recorded gate parity and provider tests
        run: pnpm eval:redlines
      - name: Run recorded fact-satisfaction production-seam tests
        run: pnpm eval:fact-satisfaction
      - name: Run recorded copywriting paired production-seam tests
        run: pnpm eval:copywriting
      - name: Run pinned copywriting promptfoo gate
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: pnpm eval:copywriting:promptfoo
      - name: Prove copywriting comparison rejects a wrong conclusion
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: |
          set +e
          pnpm eval:copywriting:promptfoo:control
          control_exit=$?
          set -e
          if [ "$control_exit" -ne 100 ]; then
            echo "Copywriting assertion control expected exit 100, received $control_exit." >&2
            exit 1
          fi
      - name: Run pinned fact-satisfaction promptfoo gate
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: pnpm eval:fact-satisfaction:promptfoo
      - name: Prove exact fact-satisfaction assertions reject a valid wrong outcome
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: |
          set +e
          pnpm eval:fact-satisfaction:promptfoo:control
          control_exit=$?
          set -e
          if [ "$control_exit" -ne 100 ]; then
            echo "Fact-satisfaction assertion control expected exit 100, received $control_exit." >&2
            exit 1
          fi
      - name: Run pinned merchant-language promptfoo gate
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: pnpm eval:merchant-language:promptfoo
      - name: Prove merchant-language assertions reject false output
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: |
          if pnpm eval:merchant-language:promptfoo:control; then
            echo "Merchant-language assertion control unexpectedly passed." >&2
            exit 1
          fi
      - name: Run BeautyPreferenceMemoryEval
        run: pnpm eval:preference-memory
      - name: Write recorded EvalRun artifact
        run: >-
          pnpm --filter @meiye/core eval:redlines:artifact
          "$GITHUB_WORKSPACE/output/evals/redlines.eval-run.json"
      - name: Write preference-memory EvalRun artifact
        run: >-
          pnpm --filter @meiye/core eval:preference-memory:artifact
          "$GITHUB_WORKSPACE/output/evals/preference-memory.eval-run.json"
      - name: Run pinned promptfoo recorded fixtures
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: >-
          pnpm dlx promptfoo@0.121.19 eval
          -c promptfooconfig.redlines.yaml
          --no-cache
          -o output/evals/promptfoo-redlines.json
      - name: Prove promptfoo assertions reject false output without provider errors
        env:
          PROMPTFOO_DISABLE_REMOTE_GENERATION: true
        run: |
          if pnpm dlx promptfoo@0.121.19 eval \
            -c promptfooconfig.redlines.assertion-control.yaml \
            --no-cache; then
            echo "Promptfoo assertion control unexpectedly passed." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-redline-evals
          path: output/evals
          if-no-files-found: error

  live-redteam:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run opt-in Volcengine red-team
        env:
          PROMPTFOO_DISABLE_REDTEAM_REMOTE_GENERATION: true
          VOLCENGINE_API_BASE_URL: ${{ secrets.VOLCENGINE_API_BASE_URL }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          VOLCENGINE_MODEL: ${{ secrets.VOLCENGINE_MODEL }}
        run: >-
          pnpm dlx promptfoo@0.121.19 redteam run
          -c promptfooconfig.redteam.yaml
          -o output/evals/live-redteam.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-redteam-results
          path: output/evals
          if-no-files-found: warn

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/contracts typecheck
      - run: pnpm --filter @meiye/core typecheck
      # pnpm appends extra script arguments after the test glob; NODE_OPTIONS
      # makes Node's test runner consume --test-reporter=spec directly.
      - run: pnpm --filter @meiye/core test
        env:
          NODE_OPTIONS: --test-reporter=spec

  # V31-08 / V3.1 §31.1b: Session Quick Checks zero-LLM behavior gates.
  # Required. V31-23 extends the shared registry only — do not replace this job.
  session-quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Session Quick Checks + Progressive Level 0/1 gates (zero LLM)
        run: >-
          pnpm --filter @meiye/core exec node --import tsx --test
          --test-concurrency=1
          src/p1/agent-session/quick-checks.test.ts
          src/p1/agent-session/progressive-levels.test.ts
        env:
          NODE_OPTIONS: --test-reporter=spec

  production-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/security
          audit_status=0
          pnpm audit --prod --json | tee output/security/pnpm-audit.json || audit_status=$?
          echo "pnpm audit raw exit code: $audit_status"
          node scripts/ci/assert-production-audit.mjs \
            output/security/pnpm-audit.json \
            docs/ops/production-dependency-audit-waivers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: output/security/pnpm-audit.json
          if-no-files-found: error

  root-quality:
    runs-on: ubuntu-latest
    # 60m was calibrated on a developer host; the hosted runner was killed at
    # the 60m mark mid-way through `pnpm test` on the first real evaluation
    # (2026-08-14, run 31812359379) with journeys/interaction/checks still
    # ahead. The bar is unchanged — the instrument just gets enough range.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # The opt-in test evidence guard runs `git log <verifiedAt>..HEAD`;
          # a shallow clone cannot reach the recorded baselines and the guard
          # fail-closes every suite as stale.
          fetch-depth: 0
      - name: Initialize root quality evidence
        run: mkdir -p output/ci/root-required-quality && touch output/ci/root-required-quality/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei
      - run: pnpm install --frozen-lockfile
      - name: Verify Harness release-version contract
        run: node scripts/ci/assert-harness-release-version.mjs
      - name: Verify V3.1 ticket index matches ticket Status fields
        run: node scripts/ci/assert-v31-ticket-index.mjs
      - name: Verify the quality-gate command contract
        run: node --test scripts/ci/*.test.mjs
      - name: Verify journey and persistence suite ownership
        run: >-
          node scripts/ci/journey-ownership-catalog.mjs validate
          --output output/ci/root-required-quality/journey-ownership.json
      - name: Run root required quality gates
        run: bash scripts/ci/run-root-required-quality.sh
        env:
          CI_EVIDENCE_DIR: output/ci/root-required-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-required-quality-evidence
          path: output/ci/root-required-quality
          if-no-files-found: error

  core-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_test
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_dbos_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize persistence evidence
        run: mkdir -p output/ci/core-persistence && touch output/ci/core-persistence/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Provision business and DBOS test databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/core-persistence/provision.log
      # The full suite runs through Node's test runner so the persisted-test
      # assertion can read an authoritative summary instead of a tsx wrapper
      # that omits it. The script fails if either database URL is absent.
      - name: Run Core with persistence gates enabled
        run: bash scripts/ci/run-core-persistence.sh
        env:
          CORE_PERSISTENCE_LOG_PATH: output/ci/core-persistence/core-persistence-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-persistence-evidence
          path: output/ci/core-persistence
          if-no-files-found: error

  # CI-01A Wave 0 instrument. This job deliberately stays advisory while its
  # per-file counts and fresh-pair controls are calibrated. CI-01B is the
  # separate decision that may later add it to `required`.
  persistence-instrument:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_instrument_business
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_instrument_dbos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Run per-file same-SHA persistence instrument
        run: bash scripts/ci/run-persistence-evidence-instrument.sh
        env:
          CI_EVIDENCE_DIR: output/ci/persistence-instrument
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-instrument-evidence
          path: output/ci/persistence-instrument
          if-no-files-found: error

  # Required browser gate. Carries the assembly gate (T04) and, since T37/M-04,
  # the three-modality mainline journey — copy / image_text / video, each on the
  # `/api/core/p1/composer/submissions` seam through adoption, delivery, and
  # refresh recovery. Named in the branch protection required-checks list via
  # the `required` aggregation job below.
  production-main-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      MODEL_EXECUTION_MODE: fixture
      PLAYWRIGHT_AUTH_BASE_URL: http://localhost:3011
      PLAYWRIGHT_BASE_URL: http://localhost:3010
      PLAYWRIGHT_CANDIDATE_PORT: 3010
      PLAYWRIGHT_CORE_PORT: 4110
      PLAYWRIGHT_PRODUCTION_CANDIDATE: true
      PORT: 3011
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_journey
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_journey_dbos
    steps:
      - uses: actions/checkout@v4
      - name: Initialize production journey evidence
        run: mkdir -p output/ci/production-main-journey && touch output/ci/production-main-journey/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision production-journey databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/production-main-journey/provision.log
      - name: Run required assembly gate, M-04 browser hard gate, and production-build main journey
        run: bash scripts/ci/run-pr-production-journey.sh
        env:
          CI_EVIDENCE_DIR: output/ci/production-main-journey
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          REQUIRED_BROWSER_HARD_GATE_SPEC: tests/e2e/specs/m04-browser-hard-gate.spec.ts
          REQUIRED_E2E_SPEC: tests/e2e/specs/assembly-gate-required-journey.spec.ts
          REQUIRED_V31_MEMORY_INJECTION_SPEC: tests/e2e/specs/v31-memory-injection-b2-journey.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-main-journey-evidence
          path: output/ci/production-main-journey
          if-no-files-found: error

  # P2 Chromium acceptance (#320–#328 surface). Telemetry since the 2026-08-14
  # gate shrink: still runs on every push/PR so a red stays visible, but it no
  # longer blocks `required` (docs/ops/ci-arbiter-gate-shrink-2026-08-14.md).
  p2-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Fixture vite stack (no wrangler production-candidate). Matches the local
      # P2 five-file 18/18 gate; candidate dual-origin made decision-card mocks
      # miss (released-hold) while production-main-journey keeps candidate env.
      CI: true
      MODEL_EXECUTION_MODE: fixture
      PLAYWRIGHT_CORE_PORT: 4110
      PORT: 3010
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_p2_browser
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_p2_browser_dbos
    steps:
      - uses: actions/checkout@v4
      - name: Initialize P2 browser acceptance evidence
        run: mkdir -p output/ci/p2-browser-acceptance && touch output/ci/p2-browser-acceptance/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision P2 browser-acceptance databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/p2-browser-acceptance/provision.log
      - name: Run P2 Chromium acceptance specs
        run: bash scripts/ci/run-p2-browser-acceptance.sh
        env:
          CI_EVIDENCE_DIR: output/ci/p2-browser-acceptance
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-browser-acceptance-evidence
          path: |
            output/ci/p2-browser-acceptance
            mkfast-template-main/test-results
          if-no-files-found: error

  # V3.1 day-0 release gate (retro R1 / V31-77). The zero-source first visit is
  # the only V3.1 browser verdict `required` blocks on since the 2026-08-14 gate
  # shrink (docs/ops/ci-arbiter-gate-shrink-2026-08-14.md): a merchant who
  # cannot walk the first visit has no product, so this journey alone decides.
  # The remaining §37.4 catalog runs in v31-browser-report below as telemetry.
  v31-day0-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      MODEL_EXECUTION_MODE: fixture
      PLAYWRIGHT_CORE_PORT: 4110
      PORT: 3010
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser_dbos
      HARNESS_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser_dbos
      V31_GATE_SCOPE: day0
    steps:
      - uses: actions/checkout@v4
      - name: Initialize V3.1 day-0 gate evidence
        run: mkdir -p output/ci/v31-day0-gate && touch output/ci/v31-day0-gate/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision V3.1 day-0 gate databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/v31-day0-gate/provision.log
      - name: Run the day-0 release-gate journey
        run: bash scripts/ci/run-v31-browser-acceptance.sh
        env:
          CI_EVIDENCE_DIR: output/ci/v31-day0-gate
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-day0-gate-evidence
          path: |
            output/ci/v31-day0-gate
            mkfast-template-main/test-results
          if-no-files-found: error

  # V3.1 §37.4 remaining catalog, one Playwright process per file. Telemetry
  # since the 2026-08-14 gate shrink: a red here stays visible on the PR and in
  # v31-file-verdicts.log but does not block `required`. Promotion of a journey
  # back into the blocking set is an explicit decision, not a default.
  v31-browser-report:
    runs-on: ubuntu-latest
    # Per remaining file boots its own Vite/workerd; 120m assumed one remaining stack.
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      MODEL_EXECUTION_MODE: fixture
      PLAYWRIGHT_CORE_PORT: 4110
      PORT: 3010
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser_dbos
      HARNESS_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_pr_v31_browser_dbos
      V31_GATE_SCOPE: remaining
    steps:
      - uses: actions/checkout@v4
      - name: Initialize V3.1 browser report evidence
        run: mkdir -p output/ci/v31-browser-report && touch output/ci/v31-browser-report/job-started.log
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision V3.1 browser-report databases
        run: >-
          set -o pipefail;
          ./scripts/ci/provision-test-db.sh 2>&1 |
          tee output/ci/v31-browser-report/provision.log
      - name: Run remaining V3.1 Chromium specs per file
        run: bash scripts/ci/run-v31-browser-acceptance.sh
        env:
          CI_EVIDENCE_DIR: output/ci/v31-browser-report
          RELEASE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-browser-report-evidence
          path: |
            output/ci/v31-browser-report
            mkfast-template-main/test-results
          if-no-files-found: error

  # Gate shrink (2026-08-14): `required` blocks on the non-browser quality jobs
  # plus exactly two browser verdicts — the production main journey (assembly +
  # M-04 hard gate + three-modality mainline smoke) and the V3.1 day-0 release
  # gate. p2-browser-acceptance and v31-browser-report run as telemetry.
  required:
    if: ${{ always() }}
    needs:
      - redline-evals
      - core
      - session-quick-checks
      - root-quality
      - core-persistence
      - production-main-journey
      - v31-day0-gate
      - production-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every ordinary quality job to succeed
        run: node scripts/ci/assert-required-jobs.mjs
        env:
          REQUIRED_CORE_PERSISTENCE_RESULT: ${{ needs.core-persistence.result }}
          REQUIRED_CORE_RESULT: ${{ needs.core.result }}
          REQUIRED_SESSION_QUICK_CHECKS_RESULT: ${{ needs.session-quick-checks.result }}
          REQUIRED_PRODUCTION_MAIN_JOURNEY_RESULT: ${{ needs.production-main-journey.result }}
          REQUIRED_V31_DAY0_GATE_RESULT: ${{ needs.v31-day0-gate.result }}
          REQUIRED_PRODUCTION_DEPENDENCY_AUDIT_RESULT: ${{ needs.production-dependency-audit.result }}
          REQUIRED_REDLINE_EVALS_RESULT: ${{ needs.redline-evals.result }}
          REQUIRED_ROOT_QUALITY_RESULT: ${{ needs.root-quality.result }}

  # Release variables are not configured; enable this only during release preparation.
  # Mints the four-unit, same-SHA staging release manifest the release-candidate
  # gate has always required. The manifest is uploaded as an artifact and the RC
  # job below downloads it, so acceptance reads one immutable document produced by
  # a build of this exact commit.
  release-manifest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei
      - run: pnpm install --frozen-lockfile
      - name: Open the release window
        run: echo "RELEASE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build every release unit
        run: pnpm build
      - name: Mint the staging release manifest
        run: node scripts/ci/build-release-manifest.mjs
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_CONFIG_REVISION: ${{ vars.RELEASE_CONFIG_REVISION }}
          RELEASE_ENVIRONMENT: staging
          RELEASE_JOURNEY_EVIDENCE_REF_COPY: ${{ vars.RELEASE_JOURNEY_EVIDENCE_REF_COPY }}
          RELEASE_JOURNEY_EVIDENCE_REF_IMAGE: ${{ vars.RELEASE_JOURNEY_EVIDENCE_REF_IMAGE }}
          RELEASE_JOURNEY_EVIDENCE_REF_VIDEO: ${{ vars.RELEASE_JOURNEY_EVIDENCE_REF_VIDEO }}
          RELEASE_MANIFEST_OUT: output/release/release-manifest.json
          RELEASE_READINESS_EVIDENCE_REF: ${{ vars.RELEASE_READINESS_EVIDENCE_REF }}
          RELEASE_RECOVERY_EVIDENCE_REF: ${{ vars.RELEASE_RECOVERY_EVIDENCE_REF }}
          RELEASE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-release-manifest
          path: output/release/release-manifest.json
          if-no-files-found: error

  # Release-candidate acceptance builds every workspace, then boots Main, Core,
  # Worker, and Canvas for the real browser harness. Ordinary browser acceptance
  # is required above and does not inherit this opt-in manifest dependency.
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    needs: release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: meiye
          POSTGRES_USER: meiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meiye -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: true
      TEST_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e
      TEST_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e_dbos
      HARNESS_DBOS_SYSTEM_DATABASE_URL: postgres://meiye:meiye@127.0.0.1:5432/meiye_e2e_dbos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-wqy-zenhei postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meiye/web exec playwright install --with-deps chromium
      - name: Provision E2E business and DBOS databases
        run: ./scripts/ci/provision-test-db.sh
      - name: Download the staging release manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-release-manifest
          path: output/release
      - name: Build and run release-candidate acceptance
        run: bash scripts/ci/run-release-candidate-quality.sh
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_MANIFEST_PATH: output/release/release-manifest.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: mkfast-template-main/test-results
          if-no-files-found: ignore
