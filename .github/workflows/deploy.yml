# Web (Cloudflare Worker) deployment.
#
# T40/E-01: this workflow used to live in `mkfast-template-main/.github/workflows/`,
# where GitHub never discovered it, and every command assumed the template
# directory as the working directory. It now lives at the repository root with
# explicit per-step working directories.
#
# The trigger is the completed Core quality run for main. The source workflow
# mints and consumes the staging release manifest at the same SHA before this
# workflow can start, so production cannot bypass required or RC evidence.
name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ['Core quality']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Raised from 15 for the Advisory telemetry wait below (up to 30 minutes)
    # plus the existing build/deploy budget (arbitration 2026-08-23).
    timeout-minutes: 50
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      # --- Cloudflare credentials (needed by cf-typegen in postinstall) ---
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      # Required release gate: Workers code must never precede PostgreSQL migrations.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # --- Client-side (VITE_*) env vars baked into the build ---
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      VITE_PAYMENT_PROVIDER: ${{ secrets.VITE_PAYMENT_PROVIDER }}
      VITE_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.VITE_STRIPE_PRICE_PRO_MONTHLY }}
      VITE_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.VITE_STRIPE_PRICE_PRO_YEARLY }}
      VITE_STRIPE_PRICE_LIFETIME: ${{ secrets.VITE_STRIPE_PRICE_LIFETIME }}
      VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
      VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
      VITE_PLAUSIBLE_SCRIPT: ${{ secrets.VITE_PLAUSIBLE_SCRIPT }}
      VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
      VITE_UMAMI_SCRIPT: ${{ secrets.VITE_UMAMI_SCRIPT }}
      VITE_CRISP_WEBSITE_ID: ${{ secrets.VITE_CRISP_WEBSITE_ID }}

    steps:
      # Deploy gate (arbitration 2026-08-23). The 2026-08-14 gate shrink moved
      # `p2-browser-acceptance` and `v31-browser-report` out of Core quality
      # into the `Advisory telemetry` workflow. Those two jobs are why Core
      # quality stayed red on main, and why ~100 consecutive Deploy runs were
      # skipped. Making Core quality green again therefore hands production its
      # first real deploy while both browser verdicts are still red. Advisory
      # telemetry stays non-blocking for MERGE; it is blocking for DEPLOY.
      # Advisory telemetry can finish after Core quality (its browser jobs run
      # far longer), so poll the same head_sha for up to 30 minutes; a timeout
      # counts as not passing.
      - name: Require a green same-SHA Advisory telemetry run
        timeout-minutes: 31
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          max_attempts=30
          attempt=1
          while [ "${attempt}" -le "${max_attempts}" ]; do
            if ! runs="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/advisory-telemetry.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | {id, status, conclusion, created_at, html_url}]')"; then
              echo "Advisory telemetry lookup failed (attempt ${attempt}/${max_attempts})."
              runs='[]'
            fi
            latest="$(printf '%s' "${runs}" | jq -c 'sort_by(.created_at) | last // empty')"
            status="$(printf '%s' "${latest}" | jq -r '.status // ""')"
            conclusion="$(printf '%s' "${latest}" | jq -r '.conclusion // ""')"
            url="$(printf '%s' "${latest}" | jq -r '.html_url // ""')"

            if [ -z "${latest}" ]; then
              reason="no Advisory telemetry run exists yet for ${HEAD_SHA}"
            elif [ "${status}" != "completed" ]; then
              reason="Advisory telemetry run is '${status}' (${url})"
            elif [ "${conclusion}" = "success" ]; then
              echo "Advisory telemetry is green for ${HEAD_SHA}: ${url}"
              exit 0
            else
              echo "::error::Deploy blocked: Advisory telemetry for ${HEAD_SHA} concluded '${conclusion}'."
              echo "Run: ${url}"
              echo "p2-browser-acceptance / v31-browser-report are advisory for merge, blocking for deploy."
              exit 1
            fi

            echo "${reason}; waiting 60s (attempt ${attempt}/${max_attempts})."
            sleep 60
            attempt=$((attempt + 1))
          done
          echo "::error::Deploy blocked: no completed Advisory telemetry run for ${HEAD_SHA} after ${max_attempts} minutes."
          echo "A timeout is treated as not passing; re-run Deploy once Advisory telemetry finishes green."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Install from the workspace root: the lockfile and pnpm-workspace.yaml
      # live there and the Web unit depends on workspace packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Harness release-version contract
        run: node scripts/ci/assert-harness-release-version.mjs

      - name: Download same-SHA staging release manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-release-manifest
          path: output/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify same-SHA release evidence
        env:
          RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_MANIFEST_PATH: output/release/release-manifest.json
        run: node scripts/ci/verify-release-manifest.mjs

      - name: Require real Cloudflare resources
        run: node scripts/ops/verify-wrangler-config.mjs --require-real-resources

      - name: Apply PostgreSQL migrations before release
        working-directory: mkfast-template-main
        run: |
          test -n "$DATABASE_URL"
          pnpm db:migrate:remote

      # Build only the Web unit: the root `build` script fans out to every
      # workspace, which is not what a Worker deployment needs.
      - name: Build
        working-directory: mkfast-template-main
        run: pnpm build

      # wrangler.jsonc lives next to the Web unit, so wrangler must resolve its
      # configuration from that directory.
      - name: Deploy to Cloudflare Workers
        working-directory: mkfast-template-main
        run: pnpm exec wrangler deploy
