services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meiye
      POSTGRES_PASSWORD: meiye
      POSTGRES_USER: meiye
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meiye -d meiye"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "54329:5432"
    volumes:
      - meiye-postgres:/var/lib/postgresql/data

volumes:
  meiye-postgres:
