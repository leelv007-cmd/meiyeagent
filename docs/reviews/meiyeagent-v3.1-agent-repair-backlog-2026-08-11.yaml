  - id: FIX-P0-01
    title: Unify billing identity for ordinary, prepared, expiry, cancellation, and partial paths
    priority: P0
    tickets: [V31-59, V31-57]
    depends_on: [FIX-P0-00]
    scope:
      - apps/core/src/p1/harness/dbos-workflow.ts
      - apps/core/src/p1/harness/harness-executor.ts
      - apps/core/src/p1/credit-billing
      - execution_spine_billing_adapters
    steps:
      - Introduce an explicit BillingIdentity value passed from admission to every settlement/refund path.
      - Remove deep fallback from missing sourceTaskId to an inferred workflow key.
      - Fail closed when a prepared workflow cannot resolve the original usage identity.
      - Ensure no path creates a second ProductUsage row to compensate for identity mismatch.
    tests:
      - ordinary_first_attempt_success
      - prepared_attempt_success
      - hard_failure_refund
      - hold_expiry_refund
      - duplicate_resume_no_double_debit
      - source_task_not_equal_workflow_id
    acceptance:
      - Exactly one usage row and one terminal ledger outcome per merchant task.
      - Refund returns to original grant lots and does not revive expired lots.
      - Missing identity is visible failure, never silent NOT_FOUND or second-row creation.
    forbidden:
      - Guessing billing task id
      - Creating replacement usage rows
      - Proving refund only through UI text

  - id: FIX-P0-02
    title: Make recovery tenant-scoped, fair, bounded, and terminal
    priority: P0
    tickets: [V31-33, V31-41, V31-39]
    depends_on: [FIX-P0-01]
    serial_order:
      - V31-33
      - V31-41
      - V31-39_reverify
    scope:
      - apps/core/src/p1/execution-spine/postgres-creation-submission-store.ts
      - apps/core/src/p1/execution-spine/submission-coordinator.ts
      - apps/core/src/assembly/api-runtime.ts
    steps:
      - Choose per-workspace claim or global claim with explicit per-workspace quota.
      - Implement atomic claim with workspace, lease, and CAS.
      - Count prepare failures and apply bounded exponential backoff.
      - Classify permanent prepare failure and write a terminal state.
      - Refund the reservation exactly once at terminalization.
      - Preserve the persistent-arm short circuit that avoids re-running prepare after freeze.
    tests:
      - two_workspace_recovery_fairness
      - stale_lease_reclaim
      - permanent_prepare_failure_bounded
      - terminal_state_consumed_by_submit
      - exactly_once_refund
      - restart_without_duplicate_provider_start
    acceptance:
      - One workspace cannot exhaust another workspace recovery capacity.
      - Permanent failure stops scanning and releases money.
      - Operations can identify workspace, submission, attempt count, and failure class.
    forbidden:
      - Global list then tenantless claim
      - Unbounded retry
      - Fixing only logs without terminal state and refund
      - Re-running prepare for frozen persistent arm

  - id: FIX-P0-03
    title: Make PlanRevision and semantic event atomic
    priority: P0
    tickets: [V31-40]
    depends_on: [FIX-P0-00]
    scope:
      - apps/core/src/p1/agent-session/plan-compiler.ts
      - plan_revision_repository
      - semantic_event_outbox
    steps:
      - Write plan revision and event candidate in one database transaction.
      - Reuse an existing outbox lifecycle instead of creating another state machine.
      - Dispatch idempotently by planId plus revision.
      - Add lag, failure, and reconciliation observability.
    tests:
      - event_publish_failure_before_commit
      - process_kill_after_commit_before_dispatch
      - duplicate_dispatch_idempotency
      - merchant_projection_eventual_visibility
    acceptance:
      - No plan revision can exist without an outbox candidate.
      - Restart eventually projects the exact plan revision once.
      - Living Plan never depends on client-side reconstruction.
    forbidden:
      - Relying on caller retry alone
      - Adding a second canonical plan writer

  - id: FIX-P0-04
    title: Close context-fence, snapshot identity, and idempotency asymmetries
    priority: P0
    tickets: [V31-55]
    depends_on: [FIX-P0-03]
    scope:
      - apps/core/src/p1/harness/execution-plan-admission.ts
      - apps/core/src/p1/harness/postgres-execution-plan-admission-store.ts
      - apps/core/src/p1/harness/execution-plan-live-facts.ts
      - snapshot_builder_and_hashing
    steps:
      - Canonicalize JSONB round-trip comparison before deep equality.
      - Produce a new snapshot hash and admission identity for every material refresh.
      - Make identity, fact, and rights freeze/verify contracts symmetric.
      - Preserve the original stale/fence error through the HTTP boundary.
      - Add merchant-readable mappings for CONTEXT_FENCE_MISMATCH and SNAPSHOT_STALE.
    tests:
      - same_snapshot_replay_noop
      - stale_old_snapshot_rejected
      - refreshed_snapshot_executes_once
      - identity_fact_rights_mutation_matrix
      - no_idempotency_conflict_error_masking
    acceptance:
      - Old stale snapshot fails closed with the correct error.
      - New snapshot executes exactly once.
      - No merchant receives an idempotency message for a context drift.
    forbidden:
      - Reusing the old idempotency key after material change
      - Treating missing authority data as unchanged without a frozen baseline

