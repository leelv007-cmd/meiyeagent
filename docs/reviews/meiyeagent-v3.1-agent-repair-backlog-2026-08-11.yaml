  - id: FIX-P0-06
    title: Make SSR database connection failure request-scoped
    priority: P0
    tickets: [V31-50]
    depends_on: []
    scope:
      - mkfast-template-main/src/lib/auth/workspace-provisioning.ts
      - postgres_connection_factory
      - web_ssr_error_boundary
    steps:
      - Identify the two pool/socket error paths.
      - Attach equivalent error handling to both.
      - Convert connection-level failure to request-level 5xx or safe degraded render.
      - Log error code and correlation without secrets.
      - Do not add retries or increase connection limits as the fix.
    tests:
      - inject_53300_request_returns_5xx_process_survives
      - inject_socket_error_on_both_pool_paths
      - next_request_succeeds
      - mutation_remove_handler_kills_process
    acceptance:
      - Process remains alive after connection failure.
      - The next healthy request succeeds.
      - Operations can distinguish database-connection 5xx.
    forbidden:
      - Increasing max_connections
      - Retrying under connection exhaustion
      - Treating Playwright server hardening as proof of production SSR fix

